<circle cx="46" cy="288" r="5" fill="#99F6E4"/><text x="56" y="293" fill="#8FB3BC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5">[0-3]: scale j in bits 0-5, top 2 bits of scale j+4 in 6-7</text>
<circle cx="426" cy="288" r="5" fill="#FB7185"/><text x="436" y="293" fill="#8FB3BC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5">[4-7]: min j in bits 0-5, top 2 bits of min j+4 in 6-7</text>
<circle cx="806" cy="288" r="5" fill="#FBBF24"/><text x="816" y="293" fill="#8FB3BC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5">[8-11]: low 4 bits of scale j+4 | low 4 bits of min j+4 &lt;&lt; 4</text>
<text x="40" y="345" fill="#F8FAFC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Nibble order: each 32-byte chunk of qs holds 64 weights</text>
<rect x="40" y="361" width="270" height="40" rx="6" fill="#0B222B" stroke="#1B4556"/>
<text x="175" y="386" text-anchor="middle" fill="#2DD4BF" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14">qs[0..31]</text>
<rect x="40" y="425" width="130" height="34" rx="6" fill="#2DD4BF" fill-opacity=".85"/>
<rect x="180" y="425" width="130" height="34" rx="6" fill="#99F6E4" fill-opacity=".85"/>
<text x="105" y="447" text-anchor="middle" fill="#0F2933" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">low  → w0..31</text>
<text x="245" y="447" text-anchor="middle" fill="#0F2933" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">high → w32..63</text>
