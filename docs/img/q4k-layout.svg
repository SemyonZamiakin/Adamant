<text x="1100" y="477" text-anchor="middle" fill="#4E7A86" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11">sub-block 7 · scale[7]</text>
<text x="40" y="508" fill="#F8FAFC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">AVX2 unpack, one 32-byte load:</text>
<text x="280" y="508" fill="#99F6E4" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5">lo = bits &amp; 0x0F · hi = (bits &gt;&gt; 4) &amp; 0x0F → vpmaddubsw(lo|hi, q8) → vpmaddwd(·, scale[j]) → int32 lanes</text>
<text x="40" y="538" fill="#8FB3BC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">The mins never touch the quants again: Σ min[j] · Σ(q8 of sub-block j) comes from the 16 pre-summed bsums of the Q8_K activation block.</text>
</svg>