<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="Q4_K block layout">
<rect width="1200" height="570" rx="16" fill="#0F2933"/>
<text x="40" y="52" fill="#F8FAFC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Q4_K super-block <tspan fill="#2DD4BF">· 256 weights in 144 bytes · 4.5 bits/weight</tspan></text>
<text x="40" y="80" fill="#8FB3BC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15">w = d · scale[j] · q − dmin · min[j]   with q ∈ [0,15] (4 bits), scale/min 6-bit per 32-weight sub-block j, d/dmin fp16 per super-block</text>
<rect x="40" y="110" width="66" height="54" rx="6" fill="#FBBF24" fill-opacity=".9"/>
<text x="73.0" y="136" text-anchor="middle" fill="#0F2933" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700">d</text>
<text x="73.0" y="155" text-anchor="middle" fill="#0F2933" fill-opacity=".75" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">fp16</text>
<text x="40" y="182" fill="#4E7A86" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">0</text>
<rect x="110" y="110" width="66" height="54" rx="6" fill="#FB7185" fill-opacity=".9"/>
<text x="143.0" y="136" text-anchor="middle" fill="#0F2933" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700">dmin</text>
<text x="143.0" y="155" text-anchor="middle" fill="#0F2933" fill-opacity=".75" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">fp16</text>
<text x="110" y="182" fill="#4E7A86" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">2</text>
<rect x="180" y="110" width="166" height="54" rx="6" fill="#99F6E4" fill-opacity=".9"/>
<text x="263.0" y="136" text-anchor="middle" fill="#0F2933" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700">scales[12]</text>
<text x="263.0" y="155" text-anchor="middle" fill="#0F2933" fill-opacity=".75" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">16 × 6 bit</text>
<text x="180" y="182" fill="#4E7A86" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">4</text>
<rect x="350" y="110" width="806" height="54" rx="6" fill="#2DD4BF" fill-opacity=".9"/>
<text x="753.0" y="136" text-anchor="middle" fill="#0F2933" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700">qs[128]: 256 × 4-bit quants, two per byte</text>
<text x="753.0" y="155" text-anchor="middle" fill="#0F2933" fill-opacity=".75" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">128 bytes</text>
<text x="350" y="182" fill="#4E7A86" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12">16</text>
<text x="40" y="220" fill="#F8FAFC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">6-bit scale / min packing in scales[12]</text>
