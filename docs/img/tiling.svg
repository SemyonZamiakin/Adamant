<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Matrix-vector tiling">
<rect width="1200" height="520" rx="16" fill="#0F2933"/>
<text x="40" y="52" fill="#F8FAFC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Matrix × vector, one token <tspan fill="#2DD4BF">· how the work is cut</tspan></text>
<text x="40" y="80" fill="#8FB3BC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15">Weights are read once per token, straight from the mmap. The activation vector is quantized once (Q8_K / Q8_0) and stays hot in L1/L2 for every row.</text>
