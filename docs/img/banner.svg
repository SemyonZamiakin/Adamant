<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Adamant SIMD-VIC by Euclase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2933"/><stop offset="1" stop-color="#0A1F27"/></linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#99F6E4"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".45"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0F2933" stop-opacity="1"/><stop offset=".12" stop-color="#0F2933" stop-opacity="0"/><stop offset=".88" stop-color="#0A1F27" stop-opacity="0"/><stop offset="1" stop-color="#0A1F27" stop-opacity="1"/></linearGradient>
    <clipPath id="stripclip"><rect x="0" y="282" width="1280" height="40"/></clipPath>
    <style>
      .lane { transform-box: fill-box; transform-origin: 50% 100%; animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scaleY(.18); opacity:.55 } 50% { transform: scaleY(1); opacity:1 } }
      .halo { transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: scale(.85); opacity:.55 } 50% { transform: scale(1.1); opacity:1 } }
      .strip { animation: flow 14s linear infinite; }
      @keyframes flow { from { transform: translateX(0) } to { transform: translateX(-720px) } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .sum { animation: sumglow 1.8s ease-in-out infinite; }
      @keyframes sumglow { 0%,100% { opacity:.35 } 60% { opacity:1 } }
    </style>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
