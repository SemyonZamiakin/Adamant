  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="280" y="138" fill="#F8FAFC" font-size="66" font-weight="700" letter-spacing="-1.5">Adamant <tspan fill="#2DD4BF">SIMD-VIC</tspan></text>
    <text x="284" y="184" fill="#8FB3BC" font-size="22">SIMD-Vectorized Inference Core for quantized LLMs</text>
    <text x="284" y="218" fill="#4E7A86" font-size="17" font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace">AVX2 · Q4_K · Q6_K · Q8_0 · zero-copy mmap · alignas(64) · C++17<tspan class="caret" fill="#2DD4BF"> ▌</tspan></text>
    <text x="284" y="258" fill="#2DD4BF" font-size="17" font-weight="600" letter-spacing="5">BY EUCLASE</text>
  </g>
  <!-- ymm0: eight 32-bit lanes accumulating -->
  <g font-family="Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace">
    <text x="962" y="84" fill="#4E7A86" font-size="14">ymm0 · 8 × int32 lanes</text>
